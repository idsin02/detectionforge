[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "detectionforge"
dynamic = ["version"]
description = "Detection-as-Code: versioned, schema-validated, test-proven detections with evidence bundles."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dhruv Singh" }]
keywords = ["detection-engineering", "sigma", "kql", "threat-hunting", "detection-as-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
# "core" group = runtime dependencies (installed by plain `pip install -e .`)
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0.1",
  "Jinja2>=3.1",
  "pySigma>=2.1,<3",
  "pySigma-backend-sqlite>=2.1.1,<3",
  "duckdb>=1.0",
  "yara-python>=4.5",
  "mitreattack-python",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "yamllint>=1.35",
  "pre-commit>=3.7",
  "sigma-cli",
  "jsonschema>=4.21",
]
kusto = [
  "pySigma-backend-kusto",
  "azure-kusto-data>=4.0",
]

[project.scripts]
dforge = "detectionforge.cli:main"

[project.urls]
Repository = "https://github.com/DHRUxMAN/DetectionForge"

[tool.hatch.version]
path = "detectionforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["detectionforge"]

# ---------------- ruff ----------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N", "C4", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["detectionforge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.11"
files = ["detectionforge"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["sigma.*", "yara", "mitreattack.*", "azure.kusto.*", "jsonschema.*"]
ignore_missing_imports = true

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"